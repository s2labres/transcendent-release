[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcend"
version = "0.9.0"
description = "Transcend: A library for detecting concept drift using conformal evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cycler>=0.12.1",
    "kiwisolver>=1.5.1",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pyparsing>=3.2.0",
    "python-dateutil>=2.9.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.15.0",
    "six>=1.17.0",
    "termcolor>=2.0.0",
    "tqdm>=4.66.0",
    "ujson>=5.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["transcend"]

